name: Vendor licensed background music

# Keep recordings in the repository so gameplay does not depend on live access
# to an external music server. A workflow commit triggers normal dev validation.
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/vendor-licensed-music.yml
      - scripts/vendor-licensed-music.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-licensed-music
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: Install audio codec tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch and compress six licensed songs
        run: bash scripts/vendor-licensed-music.sh
      - name: Commit recordings to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/music/*.mp3
          if git diff --cached --quiet; then
            echo 'Music assets already match the current version.'
            exit 0
          fi
          git commit -m 'assets(music): bundle six CC BY 4.0 soundtrack recordings'
          git push origin HEAD:dev
