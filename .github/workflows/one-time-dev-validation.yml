name: Vanguard Ops one-time dev validation

# Temporary: runs when this exact workflow file is first committed to dev.
# Other feature commits do not match this path filter.
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-time-dev-validation.yml

permissions:
  contents: read

jobs:
  validate:
    name: Smoke tests, TypeScript, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Run all smoke tests
        run: bun run test:smoke
      - name: Type-check application
        run: bun run typecheck
      - name: Production build
        run: bun run build
