name: Weapon audio regression

on:
  push:
    branches: [dev]
    paths:
      - 'src/lib/weapon-audio.ts'
      - 'src/lib/audio-mix.ts'
      - 'src/lib/fps-engine.ts'
      - 'tests/weapon-audio.test.ts'
      - '.github/workflows/weapon-audio.yml'
  pull_request:
    paths:
      - 'src/lib/weapon-audio.ts'
      - 'src/lib/audio-mix.ts'
      - 'src/lib/fps-engine.ts'
      - 'tests/weapon-audio.test.ts'
  workflow_dispatch:

jobs:
  weapon-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify weapon audio profile regressions
        run: bun test tests/weapon-audio.test.ts
      - name: Type check application
        run: bunx tsc --noEmit
