name: Weapon audio source validation

on:
  push:
    branches: [dev]
    paths:
      - 'src/lib/weapon-audio.ts'
      - 'src/lib/audio-mix.ts'
      - 'src/lib/fps-engine.ts'
      - '.github/workflows/weapon-audio.yml'
  pull_request:
    paths:
      - 'src/lib/weapon-audio.ts'
      - 'src/lib/audio-mix.ts'
      - 'src/lib/fps-engine.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weapon-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate catalog values, IDs and references
        run: bun run content:validate
      - name: Validate generic catalog and schema contracts
        run: bun run test:smoke
      - name: Type check application
        run: bun run typecheck
