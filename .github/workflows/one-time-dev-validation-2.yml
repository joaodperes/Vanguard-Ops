name: Vanguard Ops one-time validation round 2

# Trigger exclusively by the creation of this temporary file on dev.
on:
  push:
    branches: [dev]
    paths: [".github/workflows/one-time-dev-validation-2.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Run regression and gameplay smoke tests
        id: tests
        continue-on-error: true
        run: bun run test:smoke
      - name: TypeScript application check
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Production Next.js build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Fail if any validation check failed
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "Smoke tests: $TEST_RESULT"
          echo "TypeScript: $TYPE_RESULT"
          echo "Production build: $BUILD_RESULT"
          test "$TEST_RESULT" = "success"
          test "$TYPE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
