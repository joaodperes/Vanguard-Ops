name: Vanguard Ops content and application validation

# Keep release gates data-driven: catalog/reference contracts, TypeScript and build.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - feature/wonder-weapon-expansion

permissions:
  contents: read

jobs:
  validate:
    name: Catalog references, syntax, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
      - name: Install Bun (npm fallback)
        if: steps.setup-bun.outcome == 'failure'
        run: npm install --global bun@1.4.4 && bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Validate catalog values, IDs and references
        id: catalog
        continue-on-error: true
        run: bun run content:validate
      - name: Validate generic catalog and schema contracts
        id: contracts
        continue-on-error: true
        run: bun run test:smoke
      - name: TypeScript syntax and type validation
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Production application build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Fail if any validation failed
        if: always()
        env:
          CATALOG: ${{ steps.catalog.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Catalogs and references: $CATALOG"
          echo "Generic contracts: $CONTRACTS"
          echo "TypeScript: $TYPES"
          echo "Build: $BUILD"
          test "$CATALOG" = success
          test "$CONTRACTS" = success
          test "$TYPES" = success
          test "$BUILD" = success
