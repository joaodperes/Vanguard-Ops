name: Vanguard Ops dev validation
# Comprehensive validation rerun after fixing findings from first workflow run.

# Manual by default; a push to this workflow file on dev triggers validation.
# Ordinary source commits do not automatically charge Actions minutes.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Map regression, full tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Map geometry and navigation regressions
        id: maps
        continue-on-error: true
        run: bun test tests/map-blueprints.test.ts tests/map-layout.test.ts tests/map-footprint.test.ts tests/bot-routing.test.ts
      - name: Full automated suite
        id: tests
        continue-on-error: true
        run: bun run test:smoke
      - name: TypeScript check
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Production Next.js build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Report all checks and fail on regression
        if: always()
        env:
          MAPS: ${{ steps.maps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Map tests: $MAPS"
          echo "Full suite: $TESTS"
          echo "TypeScript: $TYPES"
          echo "Build: $BUILD"
          test "$MAPS" = success
          test "$TESTS" = success
          test "$TYPES" = success
          test "$BUILD" = success
